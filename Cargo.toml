[package]
name = "rewrite-bridge"
version = "0.2.3"
edition = "2021"
description = "Common model types and a provider trait so game rewrites can load each other's assets into one scene"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/patodois/rewrite-bridge"
keywords = ["gamedev", "assets", "interop", "3d", "rewrite"]
categories = ["game-development", "rendering::data-formats"]
# The CI workflow is not part of the crate. The Bevy plugin (rewrite-bridge-bevy/) is its own package and is left out
# of this one automatically.
exclude = [".github/"]

[workspace]
# The core crate stays the root package, so `cargo test` here (and a git dependency on this repo)
# still sees only it; the Bevy plugin is a separate member with its own, much larger, dependencies.
members = ["rewrite-bridge-bevy"]

[dependencies]
memmap2 = { version = "0.9", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK and setsockopt (SO_RCVBUF) for the link; memmap2 already brings libc in on Unix.
libc = { version = "0.2", optional = true }

[features]
# The passthrough link (docs/CONTRACT.md): UDP + TCP on 127.0.0.1 and a memory-mapped pixel file.
link = ["dep:memmap2", "dep:serde_json", "dep:libc"]

# The worked example of docs/WRITING_A_PROVIDER.md; `test = true` makes `cargo test` run its tests.
[[example]]
name = "cube_provider"
test = true

[[example]]
name = "fake_host"
required-features = ["link"]

[[example]]
name = "fake_guest"
required-features = ["link"]

# The Rust side of the scripted cross-language session of tests/interop/README.md.
[[example]]
name = "interop_peer"
required-features = ["link"]

[[test]]
name = "link_loopback"
required-features = ["link"]

[[test]]
name = "link_review"
required-features = ["link"]

# The shared protocol vectors of tests/vectors/link, also run by link-java, link-c and link-cs.
[[test]]
name = "link_vectors"
required-features = ["link"]
