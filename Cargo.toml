[package]
name = "rewrite-bridge"
version = "0.1.0"
edition = "2021"
description = "Common model types and a provider trait so game rewrites can load each other's assets into one scene"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace]
# The core crate stays the root package, so `cargo test` here (and a git dependency on this repo)
# still sees only it; the Bevy plugin is a separate member with its own, much larger, dependencies.
members = ["rewrite-bridge-bevy"]

[dependencies]
memmap2 = { version = "0.9", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK and setsockopt (SO_RCVBUF) for the link; memmap2 already brings libc in on Unix.
libc = { version = "0.2", optional = true }

[features]
# The passthrough link (docs/CONTRACT.md): UDP + TCP on 127.0.0.1 and a memory-mapped pixel file.
link = ["dep:memmap2", "dep:serde_json", "dep:libc"]

# The worked example of docs/WRITING_A_PROVIDER.md; `test = true` makes `cargo test` run its tests.
[[example]]
name = "cube_provider"
test = true

[[example]]
name = "fake_host"
required-features = ["link"]

[[example]]
name = "fake_guest"
required-features = ["link"]

[[test]]
name = "link_loopback"
required-features = ["link"]

[[test]]
name = "link_review"
required-features = ["link"]
