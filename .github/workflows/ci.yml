name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test
      - run: cargo test --features link
      # The shared link vectors are consumed by four implementations; the files must be exactly what the generator
      # writes (the generator is the vectors' source, see tests/vectors/link/README.md). Ran by tests/link_vectors.rs
      # above on every OS.
      - run: python3 tests/vectors/link/gen.py --check
        if: runner.os == 'Linux'
      # `cargo test` also runs the tests of the cube provider (the guide's example) and tests/docs.rs
      # (the guide shows the example as it is; the links in the docs lead somewhere)
      - run: cargo run --example cube_provider
      - run: cargo run --example conformance -- --id right
      - run: cargo clippy --all-targets --features link -- -D warnings

  # The Bevy plugin has its own, much larger, dependency tree, so it gets its own job and cache. It asks
  # Bevy for no audio and no gamepad support, so Linux needs no extra system packages (libasound2-dev and
  # libudev-dev are only for Bevy's default features).
  bevy:
    name: Bevy plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bevy-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: bevy-${{ matrix.os }}-
      - run: cargo test -p rewrite-bridge-bevy
      - run: cargo build -p rewrite-bridge-bevy --example viewer --features viewer
      - run: cargo clippy -p rewrite-bridge-bevy --all-targets --features viewer -- -D warnings
      # The GPU compositing (feature `compose`). Its tests compare the shaders with link::compose and skip
      # themselves where the runner has no GPU adapter; the first step prints, with `--nocapture`, which
      # adapter they got (or that they will be skipped), so the log says it plainly. A software adapter
      # (llvmpipe, WARP) runs them with a small tolerance on the comparisons that are exact on a hardware GPU
      # (see rewrite-bridge-bevy/src/compose/tests.rs). To make a missing adapter a failure on a runner that
      # is known to have one, set RB_REQUIRE_GPU=1 for the test steps.
      - run: cargo test -p rewrite-bridge-bevy --features compose,viewer --lib gpu_report -- --nocapture
      - run: cargo test -p rewrite-bridge-bevy --features compose,viewer
      - run: cargo build -p rewrite-bridge-bevy --example guest_compose --features compose,viewer
      - run: cargo clippy -p rewrite-bridge-bevy --all-targets --features compose,viewer -- -D warnings
      - run: cargo doc -p rewrite-bridge-bevy --features compose --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Windows only has to compile and lint the plugin (there is no GPU to test on, and the Bevy tree takes long
  # to build there); the compositing's GPU code is the part most likely to differ between platforms.
  bevy-windows:
    name: Bevy plugin compiles (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bevy-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: bevy-windows-
      - run: cargo check -p rewrite-bridge-bevy --all-targets --features compose,viewer
      - run: cargo clippy -p rewrite-bridge-bevy --all-targets --features compose,viewer -- -D warnings

  # The link in a WebAssembly component: wasm32-wasip2 has no threads, no process ids and no /dev/urandom. This lints
  # it for that target and runs tests/link_wasi.rs (both roles in one thread, over loopback) under wasmtime, which
  # gives the component the network and a /tmp for the endpoint file. wasmtime is the Bytecode Alliance's release,
  # pinned by version and by the SHA-256 of its tarball.
  wasm:
    name: Link on wasm32-wasip2
    runs-on: ubuntu-latest
    env:
      WASMTIME_VERSION: 50.0.1
      WASMTIME_SHA256: 685466455dd42a14774a86c36c8f2e45cbb9bd6d92a850139315df60a75498a5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy
      - name: Install wasmtime
        run: |
          name="wasmtime-v${WASMTIME_VERSION}-x86_64-linux"
          curl -sSfL -o "$name.tar.xz" "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/$name.tar.xz"
          echo "$WASMTIME_SHA256  $name.tar.xz" | sha256sum --check
          tar -xJf "$name.tar.xz"
          echo "$PWD/$name" >> "$GITHUB_PATH"
      - run: wasmtime --version
      - run: cargo clippy --target wasm32-wasip2 --features link -- -D warnings
      - name: Run the link test under wasmtime
        env:
          CARGO_TARGET_WASM32_WASIP2_RUNNER: "wasmtime run -S inherit-network --dir /tmp::/tmp"
        run: cargo test --target wasm32-wasip2 --features link --test link_wasi

  # Game files, decompiled or third-party code and secrets must never reach this public repository: this runs
  # tools/check_public_tree.py on the commits of the push or pull request (a new branch: all of its history).
  public-tree:
    name: Public tree (no game files, decompiled code or secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the commits of this push or pull request
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 tools/check_public_tree.py --range "$BASE..$HEAD"
          else
            python3 tools/check_public_tree.py --range "$HEAD"
          fi
