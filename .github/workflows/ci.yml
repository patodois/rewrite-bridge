name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test
      - run: cargo test --features link
      - run: cargo run --example conformance -- --id right
      - run: cargo clippy --all-targets --features link -- -D warnings

  # The Bevy plugin has its own, much larger, dependency tree, so it gets its own job and cache. It asks
  # Bevy for no audio and no gamepad support, so Linux needs no extra system packages (libasound2-dev and
  # libudev-dev are only for Bevy's default features).
  bevy:
    name: Bevy plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bevy-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: bevy-${{ matrix.os }}-
      - run: cargo test -p rewrite-bridge-bevy
      - run: cargo build -p rewrite-bridge-bevy --example viewer --features viewer
      - run: cargo clippy -p rewrite-bridge-bevy --all-targets --features viewer -- -D warnings
