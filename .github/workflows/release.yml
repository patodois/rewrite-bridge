name: release

# Push a tag like v0.3.1 and this builds the three test peers of this crate (fake_host, fake_guest and
# interop_peer) for macOS (Apple silicon and Intel), Linux and Windows, packs each platform into an archive with the
# README, the licenses and an INSTALL.txt, and attaches them and a SHA256SUMS file to a GitHub Release that it creates.
# Nothing here signs: SHA256SUMS.sig, the signature of SHA256SUMS by the release key, is added to the release afterwards
# by hand (`gh release upload`), the same way as for the readers' releases.
#
# Run it by hand (Actions > release > Run workflow) for a dry run: the same builds, archives and
# checksums, uploaded as workflow artifacts, but no release is created.
on:
  push:
    tags: ['v*', 'peers-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The programs of the archive, as `cargo build --example` names them (packaging/package.sh has the same list)
  CARGO_ARGS: --features link --example fake_host --example fake_guest --example interop_peer

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            smoke: true
          # Cross-compiled on the Apple silicon runner: GitHub's Intel macOS runners are being retired
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            smoke: false
          # The oldest Ubuntu runner image, so the binaries run on older distributions (glibc 2.35)
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            smoke: true
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            smoke: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-11-05)
        with:
          targets: ${{ matrix.target }}
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # peers-v0.3.1: the peers of crate version 0.3.1, for a crate tag cut before this workflow existed
            version="${GITHUB_REF_NAME#peers-}"
            echo "VERSION=$version" >> "$GITHUB_ENV"
            crate="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            if [ "$crate" != "$version" ]; then
              echo "::warning::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($crate)"
            fi
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: |
          # CARGO_ARGS is several arguments on purpose
          # shellcheck disable=SC2086
          cargo build --release --locked --target ${{ matrix.target }} $CARGO_ARGS
      # A host and a guest of the same build against each other for a few seconds: they must connect and the host must
      # present the guest's frames. Not for the Intel build, which this runner cannot run.
      - name: Smoke test
        if: matrix.smoke
        run: |
          dir="target/${{ matrix.target }}/release/examples"
          "$dir/fake_host${{ matrix.exe }}" --port 47871 --seconds 6 > host.log 2>&1 &
          host=$!
          sleep 1
          "$dir/fake_guest${{ matrix.exe }}" --port 47871 --seconds 3 --frames > guest.log 2>&1
          wait "$host"
          cat guest.log host.log
          grep -q 'connected: host "Fake Host"' guest.log
          grep -q "present #" host.log
      - name: Archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          BIN_DIR="target/${{ matrix.target }}/release/examples" bash packaging/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  package:
    name: Checksums and release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      # Preparation uses a read-only token; only the single publish step below may write.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.ref_type == 'tag' && 'release-assets' || 'dry-run-release-assets' }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # this job has no checkout, so gh needs the repository named
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name release-assets --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
          cat > notes.md <<'NOTES'
          Prebuilt test peers of the passthrough link for macOS (Apple silicon and Intel), Linux and Windows (x86_64):
          `fake_host`, `fake_guest` and `interop_peer`, the programs the guide to adding a game runs your game against.
          The archives contain no game data and need no Rust toolchain.

          The programs are not code-signed. macOS (Gatekeeper) and Windows (SmartScreen) may warn the
          first time; the INSTALL.txt in each archive says what to do. Check a download
          against `SHA256SUMS`.
          NOTES
          flags=()
          case "${GITHUB_REF_NAME#peers-}" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "rewrite-bridge $GITHUB_REF_NAME" \
              --notes-file notes.md --generate-notes "${flags[@]}"
          fi
